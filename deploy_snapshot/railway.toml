# Railway.toml - Railway deployment configuration (最適化版)
[build]
builder = "NIXPACKS"
buildCommand = "pip install --no-cache-dir -r requirements-minimal.txt"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
startCommand = "streamlit run main_fixed.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"

[environments.production.variables]
STREAMLIT_SERVER_HEADLESS = "true"
STREAMLIT_SERVER_ENABLE_CORS = "false"
STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION = "false"
STREAMLIT_SERVER_RUN_ON_SAVE = "false"
STREAMLIT_BROWSER_GATHER_USAGE_STATS = "false"
