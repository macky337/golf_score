<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Golf Score Offline</title>
  </head>
  <body>
    <main>
      <h1>⛳ 現地：オフラインスコア入力</h1>
      <p class="muted">OUT・IN終了時やラウンド終了後に端末へ保存します。通信復帰後に同期ファイルを出力してください。</p>
      <div class="notice" id="start-notice">選択したラウンドを読み込んでいます。入力内容はこの端末内に保存されます。</div>
      <div class="toolbar">
        <label class="file-label" for="import-file">予備JSONを読み込む</label>
        <input id="import-file" type="file" accept="application/json" />
        <button id="export-file" class="secondary" disabled>入力後：同期ファイルを保存</button>
      </div>
      <p id="status">ラウンドデータを読み込んでいます。</p>
      <section id="editor" hidden>
        <div class="tabs" id="tabs"></div>
        <div id="players"></div>
        <div class="checkpoint">
          <button id="save-checkpoint">この区間を端末に保存</button>
          <button id="save-all" class="secondary">全入力を端末に保存</button>
          <button id="reset-draft" class="danger">端末の入力を破棄して読み込み時の値に戻す</button>
        </div>
        <div class="total" id="totals"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
