<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Golf Score Offline</title>
  </head>
  <body>
    <main>
      <h1>⛳ オフラインスコア入力</h1>
      <p class="muted">アウト・イン終了時に端末へ保存。通信復帰後に同期ファイルを出力します。</p>
      <div class="notice">最初にWebアプリからダウンロードしたラウンドJSONを読み込んでください。入力内容はこの端末内に保存されます。</div>
      <div class="toolbar">
        <label class="file-label" for="import-file">1. ここを押して開始用JSONを選ぶ</label>
        <input id="import-file" type="file" accept="application/json" />
        <button id="export-file" class="secondary" disabled>2. 入力後：同期用ファイルを出力</button>
      </div>
      <p id="status">ラウンドデータを読み込んでください。</p>
      <section id="editor" hidden>
        <div class="tabs" id="tabs"></div>
        <div id="players"></div>
        <div class="checkpoint">
          <button id="save-checkpoint">この区間を端末に保存</button>
          <button id="save-all" class="secondary">全入力を端末に保存</button>
        </div>
        <div class="total" id="totals"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
